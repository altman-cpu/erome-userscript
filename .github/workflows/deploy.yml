name: verify-and-deploy

# Deployment is deliberately boring: the gate must pass on the exact commit
# that goes live, and only the five shell files are published — not the tests,
# not the scripts, not the git history.
#
# One-time setup in the repository: Settings → Pages → Source: GitHub Actions.
# No secrets are used or needed; nothing here reads a token from the client.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax, metadata, lint, tests, hygiene
        run: npm run verify

  deploy:
    name: publish shell
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the published shell
        run: |
          set -Eeuo pipefail
          mkdir -p _site
          cp index.html styles.css app.js sw.js erome.user.js _headers _site/
          printf 'user-agent: *\ndisallow:\n' > _site/robots.txt
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
